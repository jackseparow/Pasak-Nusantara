<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geoblock - Pasak Nusantara 3D</title>
  
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/id.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f6f9;
    }
    
    /* Header & Banner Identitas */
    header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.2));
    }
    .title-group h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .title-group p {
      font-size: 0.8rem;
      opacity: 0.85;
    }
    
    /* Main Layout */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 62px);
    }
    #blocklyDiv {
      height: 100%;
      width: 55%;
    }
    #previewContainer {
      width: 45%;
      height: 100%;
      background-color: #1a1a24;
      display: flex;
      flex-direction: column;
      border-left: 2px solid #333;
    }

    /* Modul Kontrol Fase Game */
    .phase-control-bar {
      background-color: #252533;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #3a3a4d;
    }
    .btn-phase {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #4a4a60;
      background-color: #2d2d3f;
      color: #a0a0b8;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-phase:hover {
      background-color: #3b3b52;
      color: #ffffff;
    }
    .btn-phase.active {
      background-color: #2a5298;
      color: #ffffff;
      border-color: #4a82e8;
      box-shadow: 0 2px 6px rgba(42, 82, 152, 0.4);
    }
    .btn-phase.shake-btn.active {
      background-color: #d9534f;
      border-color: #ff6b67;
      box-shadow: 0 2px 6px rgba(217, 83, 79, 0.4);
    }

    .preview-header {
      background-color: #1e1e2a;
      color: #8a8a9e;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #codeOutput {
      flex: 1;
      padding: 16px;
      color: #a6e22e;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      white-space: pre-wrap;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="assets/logo-bbgtk.png" alt="BBGTK" class="header-logo" onerror="this.style.display='none'">
      <img src="assets/logo-taman-numerasi.png" alt="Taman Numerasi" class="header-logo" onerror="this.style.display='none'">
      <div class="title-group">
        <h1>GEOBLOCK 3D: PASAK NUSANTARA</h1>
        <p>Eksplorasi Geometri & Sambungan Kayu Tradisional</p>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div id="blocklyDiv"></div>
    <div id="previewContainer">
      
      <div class="phase-control-bar">
        <button id="btnPahat" class="btn-phase active" onclick="setFase('pahat')">
          <span>1. Pahat</span>
        </button>
        <button id="btnRakit" class="btn-phase" onclick="setFase('rakit')">
          <span>2. Pasang</span>
        </button>
        <button id="btnUji" class="btn-phase shake-btn" onclick="setFase('uji')">
          <span>3. Uji Gempa</span>
        </button>
      </div>

      <div class="preview-header">
        <span id="phaseStatus">Fase 1: Pahat Modul 3D</span>
      </div>
      <pre id="codeOutput">// Susun blok di sebelah kiri untuk merancang Pasak Nusantara...</pre>
    </div>
  </div>

  <xml id="toolbox" style="display: none">
    <category name="Bentuk Kayu" colour="35">
      <block type="balok_kayu">
        <value name="PANJANG">
          <shadow type="math_number"><field name="NUM">10</field></shadow>
        </value>
        <value name="LEBAR">
          <shadow type="math_number"><field name="NUM">10</field></shadow>
        </value>
        <value name="TINGGI">
          <shadow type="math_number"><field name="NUM">50</field></shadow>
        </value>
      </block>
    </category>
    <category name="Pasak & Pahat" colour="160">
      <block type="gabung_purus"></block>
      <block type="potong_lubang"></block>
    </category>
    <category name="Angka" colour="230">
      <block type="math_number"></block>
    </category>
  </xml>

  <script src="js/blocks.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
