<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Pemotongan Kayu 3D</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Three.js Library & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

  <!-- Area Viewport 3D Canvas -->
  <div id="viewport"></div>

  <!-- Rotation Tooltip -->
  <div id="rotationTooltip" style="display: none;">Rotasi: X: 0° | Y: 0° | Z: 0°</div>

  <!-- Sidebar & Controls UI -->
  <div class="sidebar">
    <h3>🪵 Area Kerja Woodworking</h3>
    
    <!-- Fase Switcher -->
    <div class="btn-group">
      <button id="fasePahat" class="active" onclick="setFase('pahat')">🪛 Pahat</button>
      <button id="faseRakit" onclick="setFase('rakit')">🧩 Rakit</button>
      <button id="faseUji" onclick="setFase('uji')">📐 Uji</button>
    </div>

    <!-- Pilihan Alat Pemahat -->
    <h4>Alat Pemahat</h4>
    <div class="btn-group">
      <button id="item-gergaji" onclick="toggleAlat('gergaji')">🪚 Gergaji</button>
      <button id="item-pahat" onclick="toggleAlat('pahat')">🪛 Pahat</button>
      <button id="item-bor" onclick="toggleAlat('bor')">🔘 Bor</button>
    </div>

    <!-- Tambah Benda Kerja -->
    <h4>Tambah Benda Kerja</h4>
    <div class="btn-group">
      <button id="type-balok" class="active" onclick="setJenisBahanBaru('balok')">Balok</button>
      <button id="type-silinder" onclick="setJenisBahanBaru('silinder')">Silinder</button>
    </div>
    <button class="btn-primary" onclick="tambahBendaKerja()">+ Tambah Bahan</button>

    <!-- Daftar Benda Kerja -->
    <h4>Daftar Benda Kerja</h4>
    <div id="objectList"></div>

    <!-- Pengaturan Objek Terpilih -->
    <div id="selectedObjectControls" style="display: none;">
      <h4>Edit Dimensi Objek</h4>
      
      <div id="groupBalokDim" class="input-group">
        <label>Panjang (P): <input type="number" id="objP" onchange="updateObjekTerpilih()"></label>
        <label>Lebar (L): <input type="number" id="objL" onchange="updateObjekTerpilih()"></label>
        <label>Tinggi/Tebal (T): <input type="number" id="objT" onchange="updateObjekTerpilih()"></label>
      </div>

      <div id="groupSilinderDim" class="input-group" style="display: none;">
        <label>Diameter (D): <input type="number" id="objDiameter" onchange="updateObjekTerpilih()"></label>
        <label>Tinggi (P): <input type="number" id="objTinggiSilinder" onchange="updateObjekTerpilih()"></label>
      </div>

      <label class="slider-label">Transparansi: 
        <input type="range" id="objOpacity" min="0.1" max="1.0" step="0.05" oninput="updateObjekTerpilih()">
        <span id="opacityVal">100%</span>
      </label>

      <div class="rot-inputs">
        <label>Rotasi X: <input type="number" id="objRotX" onchange="updateObjekRotasiManual()"></label>
        <label>Y: <input type="number" id="objRotY" onchange="updateObjekRotasiManual()"></label>
        <label>Z: <input type="number" id="objRotZ" onchange="updateObjekRotasiManual()"></label>
      </div>
    </div>

    <!-- Modus Gizmo -->
    <div class="gizmo-controls">
      <button id="btnToggleTranslate" class="active" onclick="setGizmoActiveMode('translate')">Move</button>
      <button id="btnToggleRotate" onclick="setGizmoActiveMode('rotate')">Rotate</button>
      <button id="btnToggleOff" onclick="setGizmoActiveMode('off')">Off</button>
      <button class="btn-danger" onclick="bersihkanAreaKerja()">Kosongkan</button>
    </div>
  </div>

  <!-- Overlay Panel Alat -->
  <div id="toolOverlayPanel" style="display: none;">
    <h4><span id="toolOverlayIcon">🪛</span> <span id="toolOverlayName">Kontrol Alat</span></h4>
    
    <div id="rowToolDiameter" class="tool-row">
      <label id="lblToolDiameter">Diameter Alat:</label>
      <input type="number" id="toolDiameter" value="2" min="0.5" step="0.5" onchange="updateAlatTransform()">
    </div>

    <div class="tool-row">
      <label>Kedalaman Potong:</label>
      <input type="number" id="toolDepth" value="6" min="1" step="0.5" onchange="updateAlatTransform()">
    </div>

    <button class="btn-execute" onclick="eksekusiPemotongan()">Eksekusi Pemotongan</button>
    
    <div id="hintBoxText">💡 Klik permukaan kayu untuk menempatkan alat.</div>
  </div>

  <!-- MAIN APP SCRIPT -->
  <script src="js/app.js"></script>
</body>
</html>
